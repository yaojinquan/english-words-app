<script>


function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

function cardHtml(w, i){
  return '<div class="card" data-en="'+esc(w.en)+'" data-zh="'+esc(w.zh)+'"'
    + ' data-s="'+esc(w.s)+'" data-sc="'+esc(w.sc)+'">'
    + '<div class="r1"><span class="num">'+(i+1)+'</span>'
    + '<span class="en">'+esc(w.en)+'</span>'
    + '<span class="ipa">'+esc(w.ipa)+'</span><span class="spacer"></span>'
    + '<button class="tts" data-t="'+esc(w.en)+'" data-l="en" title="朗读单词（英文）">🔊 英</button>'
    + '<button class="tts" data-t="'+esc(w.zh)+'" data-l="zh" title="朗读释义（中文）">🔊 中</button></div>'
    + '<div class="zh">'+esc(w.zh)+'</div>'
    + '<div class="sent"><button class="tts" data-t="'+esc(w.s)+'" data-l="en" title="朗读例句（英文）">🔊</button>'
    + '<span class="sen-en">'+esc(w.s)+'</span></div>'
    + '<div class="sent"><button class="tts" data-t="'+esc(w.sc)+'" data-l="zh" title="朗读例句（中文）">🔊</button>'
    + '<span class="sen-zh">'+esc(w.sc)+'</span></div>'
    + '</div>';
}

/* ---------- 课本切换 ---------- */
const BOOKS = [window.BOOK_G3_1, window.BOOK_G3_2, window.BOOK_G4_1, window.BOOK_G4_2]
  .filter(function(b){ return !!b; });
const BK = 'ew_book_v1';
let CUR = BOOKS[0];
function totalWords(b){ return b.units.reduce(function(n,u){ return n + u.words.length; }, 0); }

function renderBooks(){
  const box = document.getElementById('books');
  box.innerHTML = '';
  BOOKS.forEach(function(b){
    const t = document.createElement('button');
    t.textContent = b.name + ' · ' + totalWords(b) + '词';
    if(b.id === CUR.id) t.className = 'on';
    t.onclick = function(){ if(b.id !== CUR.id) switchBook(b.id); };
    box.appendChild(t);
  });
  const v = document.getElementById('ver');
  v.textContent = '📘 ' + CUR.version + '　·　' + CUR.units.length + ' 个单元 · ' + totalWords(CUR) + ' 个词条';
}
function switchBook(id){
  stopAll();
  const b = BOOKS.filter(function(x){ return x.id === id; })[0];
  if(!b) return;
  CUR = b;
  try{ localStorage.setItem(BK, id); }catch(e){}
  renderBooks();
  render();
  applySearch();
  try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){}
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  CUR.units.forEach(function(u, ui){
    const det = document.createElement('details');
    det.className = 'unit'; det.id = 'unit'+ui;
    if(ui === 0) det.open = true;
    det.innerHTML = '<summary><span class="uname">'+esc(u.name)+'</span>'
      + '<span class="meta">'+u.words.length+' 词</span>'
      + '<button class="play-all" data-u="'+ui+'">▶ 连播本单元</button></summary>'
      + '<div class="cards">' + u.words.map(cardHtml).join('') + '</div>';
    app.appendChild(det);
  });
  const tip = document.createElement('div');
  tip.className = 'none'; tip.style.display = 'none'; tip.id = 'noRes';
  tip.textContent = '没有匹配的单词';
  app.appendChild(tip);
}

/* ---------- 发音引擎 ---------- */
/* 手机（尤其微信内置浏览器）对 speechSynthesis 支持很差，经常完全无声。
   因此改为「在线发音音频优先 + 浏览器 TTS 兜底」：<audio> 在微信里可用，TTS 不可靠。 */
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? (speechSynthesis.getVoices()||[]) : []; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){
  loadVoices();
  if(!voices.length) return null;
  const want = lang === 'zh' ? 'zh' : 'en';
  const exact = lang === 'zh' ? 'zh-cn' : 'en-us';
  const lt = function(x){ return (x.lang||'').toLowerCase().replace('_','-'); };
  let v = voices.find(function(x){ return lt(x) === exact && x.localService; })
        || voices.find(function(x){ return lt(x) === exact; })
        || voices.find(function(x){ return lt(x).indexOf(want) === 0 && x.localService; })
        || voices.find(function(x){ return lt(x).indexOf(want) === 0; });
  return v || null;
}
function rate(){ const s = document.getElementById('speed'); return s ? parseFloat(s.value) : 0.85; }

/* 在线发音（有道公开发音接口，国内可直接访问） */
function audioUrl(text, lang){
  return 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text)
       + (lang === 'zh' ? '&le=zh' : '&type=1');
}
let audioEl = null;
function getAudio(){
  if(!audioEl){ audioEl = new Audio(); audioEl.preload = 'auto'; }
  return audioEl;
}
function stopSound(){
  try{ if(audioEl){ audioEl.pause(); audioEl.currentTime = 0; } }catch(e){}
  if(window.speechSynthesis){ try{ speechSynthesis.cancel(); }catch(e){} }
}

/* 浏览器 TTS 兜底：修复 cancel 紧跟 speak 被吞、以及对象被回收的问题 */
let lastUtt = null;
function ttsSpeak(text, lang, onend, onerr){
  if(!window.speechSynthesis){ if(onerr) onerr(); return; }
  try{ speechSynthesis.resume(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
  const v = pickVoice(lang); if(v) u.voice = v;
  u.rate = rate();
  lastUtt = u;                       // 保持引用，避免被 GC 中断
  if(onend) u.onend = onend;
  if(onerr) u.onerror = onerr;
  setTimeout(function(){ try{ speechSynthesis.speak(u); }catch(e){ if(onerr) onerr(); } }, 0);
}

/* 统一入口：先试在线音频，播不出来自动切浏览器 TTS */
function speak(text, lang, onend, onerr){
  text = String(text == null ? '' : text).trim();
  if(!text){ if(onend) onend(); return; }
  stopSound();
  const a = getAudio();
  let finished = false, timer = null;
  const done = function(){
    if(finished) return; finished = true;
    if(timer) clearTimeout(timer);
    a.onended = a.onerror = null;
    if(onend) onend();
  };
  const fail = function(){
    if(finished) return; finished = true;
    if(timer) clearTimeout(timer);
    a.onended = a.onerror = null;
    try{ a.pause(); }catch(e){}
    ttsSpeak(text, lang, onend, onerr);
  };
  timer = setTimeout(fail, 8000);   // 8 秒还播不完视为失败
  a.onended = done;
  a.onerror = fail;
  a.src = audioUrl(text, lang);
  try{ a.playbackRate = rate(); }catch(e){}
  const p = a.play();
  if(p && p.catch) p.catch(fail);
}

/* 发音自检 */
function testVoice(){
  const box = document.getElementById('voiceWarn');
  box.style.display = 'block';
  box.className = '';
  box.textContent = '🔊 正在试听…';
  speak('hello', 'en', function(){
    box.textContent = '✅ 发音正常（如仍听不到，请调高音量；iPhone 请关掉侧边静音开关）。';
  }, function(){
    box.textContent = '⚠ 发音失败：请改用 Safari / Chrome 打开，或检查网络。';
  });
}

function stopAll(){
  playing = false; curSteps = null;
  stopSound();
  clearHi();
}

/* ---------- 连播 ---------- */
let playing = false, curSteps = null;
function clearHi(){
  document.querySelectorAll('.card.hi').forEach(function(c){ c.classList.remove('hi'); });
}
function playUnit(ui){
  const cards = Array.prototype.slice.call(
    document.querySelectorAll('#unit'+ui+' .card'));
  curSteps = [];
  cards.forEach(function(c){
    curSteps.push({t:c.dataset.en, l:'en', c:c});
    curSteps.push({t:c.dataset.zh, l:'zh', c:c});
    curSteps.push({t:c.dataset.s,  l:'en', c:c});
    curSteps.push({t:c.dataset.sc, l:'zh', c:c});
  });
  playing = true;
  next(0);
}
function next(i){
  if(!playing || !curSteps || i >= curSteps.length){ stopAll(); return; }
  const st = curSteps[i];
  clearHi();
  if(st.c){ st.c.classList.add('hi'); st.c.scrollIntoView({block:'nearest', behavior:'smooth'}); }
  speak(st.t, st.l, function(){ next(i+1); }, function(){ stopAll(); });
}

/* ---------- 事件 ---------- */
document.addEventListener('click', function(e){
  const b = e.target.closest('.tts');
  if(b){ e.stopPropagation(); playing = false; speak(b.dataset.t, b.dataset.l); return; }
  const p = e.target.closest('.play-all');
  if(p){ e.preventDefault(); e.stopPropagation(); playUnit(parseInt(p.dataset.u,10)); return; }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') stopAll();
});
function applySearch(){
  const el = document.getElementById('search');
  if(!el) return;
  const q = el.value.trim().toLowerCase();
  let any = false;
  document.querySelectorAll('details.unit').forEach(function(det){
    let hit = 0;
    det.querySelectorAll('.card').forEach(function(c){
      const show = !q || c.textContent.toLowerCase().indexOf(q) !== -1;
      c.style.display = show ? '' : 'none';
      if(show) hit++;
    });
    det.style.display = hit ? '' : 'none';
    if(q){ det.open = hit > 0; } 
    if(hit) any = true;
  });
  const nr = document.getElementById('noRes');
  if(nr) nr.style.display = any ? 'none' : 'block';
}
document.getElementById('search').addEventListener('input', applySearch);
function expandAll(open){
  document.querySelectorAll('details.unit').forEach(function(d){ d.open = open; });
}

/* iOS/微信：首次真实点击时用一次性静音音频解锁播放能力（不影响正常朗读） */
window.addEventListener('click', function prime(){
  try{
    const a = new Audio();
    a.src = audioUrl('a', 'en');
    a.muted = true;
    const p = a.play();
    if(p && p.then) p.then(function(){ try{ a.pause(); }catch(e){} }).catch(function(){});
  }catch(e){}
}, { once:true, capture:true });

/* 启动：恢复上次选择的课本 */
(function(){
  try{
    const s = localStorage.getItem(BK);
    if(s){ const b = BOOKS.filter(function(x){ return x.id === s; })[0]; if(b) CUR = b; }
  }catch(e){}
  renderBooks();
  render();
})();
</script>
